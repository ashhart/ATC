name: ATC agent coordination
description: Lets independent coding agents claim issues, spot overlapping work and agree how to share it, using typed commands only.
inputs:
  token:
    description: Token with issues write and pull requests read access. The default workflow token is enough.
    default: ${{ github.token }}
  bot-login:
    description: Login of the account the token acts as.
    default: github-actions[bot]
runs:
  using: node24
  main: src/action/main.js
