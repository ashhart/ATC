name: ATC
on:
  issue_comment:
    types: [created]
  issues:
    types: [closed]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: atc
  cancel-in-progress: false
jobs:
  coordinate:
    if: github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '/atc')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: OWNER/atc-github@FULL_COMMIT_SHA
