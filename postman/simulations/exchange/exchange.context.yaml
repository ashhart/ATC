    date: "2026-10-30"
    commit: uncommitted exchange implementation on codex/pr-review-exchange
    cli: 1.76.0
  - id: collaboration-080-development
    date: "2026-11-05"
    commit: fa510d0 with uncommitted ATC 0.8 collaboration changes
