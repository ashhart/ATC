purpose:
  stands_in_for: GitHub repository policy, PR head and proof-comment reads.
  unblocks: Local verification of the real exchange server and HTTP client without posting to GitHub.
assumptions:
  - id: github-proof-contract
    status: supported
    claim: GitHub issue-comment responses identify the author, issue URL, body and creation and update times.
    reason: These fields are part of GitHub's documented issue-comment response; the local fixture models that shape.
    verification: On 2026-10-30, read the official API contract and ran scripts/exchangeSimulation.js against Postman CLI 1.76.0; the real companion connected, stored a build request and returned one pending request, with 15 upstream HTTP calls observed in the simulation log; on 2026-11-05 the ATC 0.8 development tree passed the same real HTTP simulation with a known base SHA and 15 upstream calls.
    source: https://docs.github.com/en/rest/issues/comments#get-an-issue-comment; src/exchange/github.js; scripts/exchangeSimulation.js
    updated_at: "2026-11-05"
  - id: real-account-permission-and-revocation
    status: unknown
    claim: The deployed service account can read all required fields and observe authorization revocation on the target repository.
    reason: Local HTTP tests cover revoked private permissions and edited proofs; the later public TensorFold deployment does not establish private-repository access.
    verification: On 2026-10-30, tests/exchangeFlow.test.js verified the caller denies a private account after the fixture returns permission none; the public live flow subsequently passed on TensorFold PR 1669, while a live private-repository check remains necessary.
    source: https://docs.github.com/en/rest/collaborators/collaborators#get-repository-permissions-for-a-user; tests/exchangeFlow.test.js
    updated_at: "2026-11-05"
fingerprints:
